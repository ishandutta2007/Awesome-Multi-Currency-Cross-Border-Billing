<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:12px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>

    <style>
      .title {
        font-size: 42px;
        font-weight: 800;
        letter-spacing: -0.5px;
        fill: url(#primary-grad);
      }
      .subtitle {
        font-size: 16px;
        font-weight: 400;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-size: 12px;
        font-weight: 600;
        fill: #e2e8f0;
      }
      .curr-symbol {
        font-size: 20px;
        font-weight: bold;
        fill: #38bdf8;
      }
      
      /* Dynamic animations */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
      }
      @keyframes pulseBeam {
        0%, 100% { opacity: 0.25; stroke-dashoffset: 0; }
        50% { opacity: 0.75; stroke-dashoffset: -40; }
      }
      @keyframes floatPill {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes orbitLight {
        0% { transform: translate(0, 0); }
        50% { transform: translate(30px, 15px); }
        100% { transform: translate(0, 0); }
      }

      .floating-card {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .card-alt {
        animation: floatSlow 7s ease-in-out 1s infinite;
      }
      .beam-line {
        stroke-dasharray: 8 12;
        animation: pulseBeam 4s linear infinite;
      }
      .pill-1 { animation: floatPill 4s ease-in-out infinite; }
      .pill-2 { animation: floatPill 5s ease-in-out 0.8s infinite; }
      .pill-3 { animation: floatPill 4.5s ease-in-out 1.5s infinite; }
      .g-glow { animation: orbitLight 8s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bg-grad)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="g-glow" cx="200" cy="80" r="140" fill="url(#glow-grad)" filter="url(#blur-glow)" />
  <circle class="g-glow" cx="1020" cy="260" r="160" fill="url(#glow-grad)" filter="url(#blur-glow)" style="animation-delay: -3s;" />

  <!-- Technical Grid lines (Background) -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Cross-Border Flow Stream (Dynamic SVG Paths) -->
  <path class="beam-line" d="M 50 310 C 300 240, 500 340, 800 280 C 950 250, 1100 290, 1150 220" fill="none" stroke="url(#primary-grad)" stroke-width="2" />
  <path class="beam-line" d="M 100 70 C 350 140, 650 40, 950 110 C 1050 130, 1120 100, 1180 80" fill="none" stroke="#38bdf8" stroke-width="1.5" style="animation-duration: 6s; opacity: 0.3;" />

  <!-- Animated Currency Transaction Badges / Floating Elements (Placed cleanly around margins) -->
  <g class="pill-1" transform="translate(80, 42)">
    <rect width="130" height="34" rx="17" fill="rgba(30, 41, 59, 0.75)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <circle cx="18" cy="17" r="9" fill="#10b981" />
    <text x="18" y="21" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">$</text>
    <text x="36" y="22" class="badge-text">USD · Multi-Currency</text>
  </g>

  <g class="pill-2" transform="translate(1000, 46)">
    <rect width="124" height="34" rx="17" fill="rgba(30, 41, 59, 0.75)" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1" />
    <circle cx="18" cy="17" r="9" fill="#6366f1" />
    <text x="18" y="21" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">€</text>
    <text x="36" y="22" class="badge-text">EUR · SEPA Instant</text>
  </g>

  <g class="pill-3" transform="translate(970, 275)">
    <rect width="150" height="34" rx="17" fill="rgba(30, 41, 59, 0.75)" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1" />
    <circle cx="18" cy="17" r="9" fill="#f59e0b" />
    <text x="18" y="21" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">¥</text>
    <text x="36" y="22" class="badge-text">JPY · Cross-Border</text>
  </g>

  <g class="pill-2" transform="translate(70, 280)">
    <rect width="140" height="34" rx="17" fill="rgba(30, 41, 59, 0.75)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
    <circle cx="18" cy="17" r="9" fill="#06b6d4" />
    <text x="18" y="21" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">£</text>
    <text x="36" y="22" class="badge-text">GBP · Global Payout</text>
  </g>

  <!-- FOREGROUND CONTENT: Header & Core Messaging (Clear & Unobscured) -->
  <g transform="translate(600, 140)" text-anchor="middle">
    <!-- Super-header pill -->
    <rect x="-160" y="-38" width="320" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
    <text x="0" y="-20" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.2">CURATED ECOSYSTEM DIRECTORY</text>

    <!-- Main Title -->
    <text x="0" y="32" class="title">Awesome Multi-Currency &amp; Cross-Border Billing</text>

    <!-- Subtitle -->
    <text x="0" y="68" class="subtitle">Global Payment Orchestration • Multi-Currency Invoicing • FX Settlements • Open-Source &amp; SaaS Architectures</text>

    <!-- Feature tags row -->
    <g transform="translate(0, 102)">
      <!-- Tag 1 -->
      <g transform="translate(-240, 0)">
        <rect x="-65" y="-12" width="130" height="24" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <text x="0" y="4" font-size="11" font-weight="500" fill="#cbd5e1" text-anchor="middle">⚡ Real-time FX Rates</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(-80, 0)">
        <rect x="-65" y="-12" width="130" height="24" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <text x="0" y="4" font-size="11" font-weight="500" fill="#cbd5e1" text-anchor="middle">🌍 Multi-Tenant Billing</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(80, 0)">
        <rect x="-65" y="-12" width="130" height="24" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <text x="0" y="4" font-size="11" font-weight="500" fill="#cbd5e1" text-anchor="middle">🛡️ Global Tax &amp; e-Invoice</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(240, 0)">
        <rect x="-65" y="-12" width="130" height="24" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
        <text x="0" y="4" font-size="11" font-weight="500" fill="#cbd5e1" text-anchor="middle">🚀 Open-Source Engines</text>
      </g>
    </g>
  </g>
</svg>
